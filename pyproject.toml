[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "HSTransform"
version = "0.2.0"
description = "S-transform with Hyperbolic Gaussian Window"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Linh V Nguyen", email = "linhvietnguyen.ee@gmail.com" }]
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.12",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov",
    "mypy",
    "ruff",
]

[project.urls]
Homepage = "https://github.com/nvlinhvn/HSTransform"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
